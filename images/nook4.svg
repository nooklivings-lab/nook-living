<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" data-name="Layer 1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080">
  <defs>
    <style>
      .cls-1 {
        fill: #ea1d6c;
      }

      .cls-2 {
        fill: #ffda08;
      }

      .cls-3 {
        fill: #e4b1fc;
      }

      .cls-4 {
        fill: #e3b2fa;
      }

      .cls-5 {
        fill: #fc6664;
      }

      .cls-6 {
        fill: #e3b2fb;
        stroke: #d191fc;
      }

      .cls-6, .cls-7, .cls-8, .cls-9 {
        stroke-miterlimit: 10;
      }

      .cls-6, .cls-9 {
        stroke-width: .46px;
      }

      .cls-10 {
        fill: #fdab8b;
      }

      .cls-7 {
        stroke-width: 1.38px;
      }

      .cls-7, .cls-8, .cls-9 {
        fill: none;
        stroke: #000;
      }

      .cls-11 {
        fill: #fd4a5c;
      }

      .cls-12 {
        fill: #fc3d5b;
      }

      .cls-13 {
        fill: #fcaf8d;
      }

      .cls-14 {
        fill: #fff;
      }

      .cls-8 {
        stroke-width: 1.84px;
      }

      .cls-15 {
        fill: #fdae8c;
      }

      .cls-16 {
        fill: #fcfbfc;
      }

      .cls-17 {
        fill: #ff495c;
      }

      .cls-18 {
        fill: #fcad8d;
      }

      .cls-19 {
        fill: #fdda02;
      }

      .cls-20 {
        fill: #fdd904;
      }

      .cls-21 {
        fill: #0091fb;
      }
    
      /* Nook Animation */
      #eyes {
        transform-box: fill-box;
        transform-origin: center;
        animation: n4Blink 3.8s infinite;
      }
      #hand {
        transform-box: fill-box;
        transform-origin: right top;
        animation: n4Hand1 3.2s ease-in-out infinite alternate;
      }
      #hand-2 {
        transform-box: fill-box;
        transform-origin: left top;
        animation: n4Hand2 3.8s ease-in-out infinite alternate;
      }
      #full-leg {
        transform-box: fill-box;
        transform-origin: top center;
        animation: n4FullLeg 4s ease-in-out infinite alternate;
      }
      #shape {
        transform-box: fill-box;
        transform-origin: center;
        animation: n4Float 5s ease-in-out infinite alternate;
      }
      @keyframes n4Blink {
        0%, 92%, 100% { transform: scaleY(1); }
        96% { transform: scaleY(0.1); }
      }
      @keyframes n4Hand1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-4deg); }
      }
      @keyframes n4Hand2 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(3.2deg); }
      }
      @keyframes n4FullLeg {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(-3.5deg); }
      }
      @keyframes n4Float {
        0% { transform: translateY(0); }
        100% { transform: translateY(-7px); }
      }
    
    </style>
  </defs>
